name = "jcomments-mini"
main = "src/worker.ts"
compatibility_date = "2024-05-01"

[vars]
SITE_KEY = "change-me"
ADMIN_KEY = "change-me-too"
# Set secrets for production via:
#   wrangler secret put SITE_KEY
#   wrangler secret put ADMIN_KEY
#   wrangler secret put TURNSTILE_SECRET  (optional, honeypot still active without it)

[[r2_buckets]]
binding = "COMMENTS"
bucket_name = "jcomments-mini"
