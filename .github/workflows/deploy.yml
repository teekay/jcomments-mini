name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Generate wrangler.toml
        run: printf '%s\n' 'name = "jcomments-mini"' 'main = "src/worker.ts"' 'compatibility_date = "2024-05-01"' '' '[[r2_buckets]]' 'binding = "COMMENTS"' 'bucket_name = "tomaskohlcom-jcomments"' > wrangler.toml

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
